<text x="180.0" y="170.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">panel web: HTML + JS embebidos</text>
<text x="180.0" y="191.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">WebSocket: instantáneas y eventos</text>
<text x="180.0" y="212.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">HTTP: historial, CSV, informe</text>
<text x="180.0" y="233.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">login de técnico por desafío</text>
<rect x="30" y="300" width="300" height="110" rx="8" fill="#e8f1fb" stroke="#1f5fa0" stroke-width="2"/>
<text x="180.0" y="329.5" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Servidor de gestión (opcional)</text>
<text x="180.0" y="350.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">Python / FastAPI en una PC</text>
<text x="180.0" y="371.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">descarga sesiones por la API</text>
<text x="180.0" y="392.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">(modelo de consulta)</text>
<rect x="30" y="450" width="300" height="90" rx="8" fill="#e8f1fb" stroke="#1f5fa0" stroke-width="2"/>
<text x="180.0" y="490.5" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Técnico: imagen OTA firmada</text>
<text x="180.0" y="511.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">subida por HTTP con token</text>
<rect x="360" y="100" width="160" height="450" rx="10" fill="#fff8e1" stroke="#b07a00" stroke-width="2"/>
<text x="440" y="135" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Wi-Fi 2,4 GHz</text>
<text x="440" y="165" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">punto de acceso</text>
<text x="440" y="195" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">propio</text>
<text x="440" y="225" font-size="16" text-anchor="middle" fill="#222" font-weight="normal"></text>
<text x="440" y="255" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">WPA2/WPA3</text>
<text x="440" y="285" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">PMF</text>
<text x="440" y="315" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">canal fijo</text>
<text x="440" y="345" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">13 dBm</text>
<text x="440" y="375" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">DTIM = 1</text>
<text x="440" y="405" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">≤ 4 clientes</text>
