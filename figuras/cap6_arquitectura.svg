<text x="1195" y="202" font-size="14" text-anchor="middle" fill="#1f5fa0" font-weight="bold">q_net</text>
<polyline points="1152,410 1238,410" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<polygon points="1238,410 1225.0,416.5 1225.0,403.5" fill="#2e7d32"/>
<text x="1195" y="402" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="bold">pedido</text>
<polyline points="1300,363 1300,352" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<polygon points="1300,352 1306.5,365.0 1293.5,365.0" fill="#2e7d32"/>
<text x="1395" y="361" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="bold">q_lect / flujo</text>
<rect x="570" y="470" width="880" height="120" rx="8" fill="#fff" stroke="#888" stroke-width="2"/>
<text x="1010.0" y="504.5" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Reglas de integración</text>
<text x="1010.0" y="525.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">mbx: última instantánea (se serializa una vez); q_net: respuestas y eventos que no se pueden perder</text>
<text x="1010.0" y="546.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">envío sin bloqueo: cliente no escribible → se descarta la trama; > 2 s sin poder escribir → se cierra</text>
<text x="1010.0" y="567.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">comandos remotos → q_evt sin espera; T_APP valida el estado y responde ack / nack con motivo</text>
<rect x="570" y="605" width="880" height="90" rx="8" fill="#fff" stroke="#888" stroke-width="2"/>
<text x="1010.0" y="635.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Fecha y hora</text>
<text x="1010.0" y="656.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">RTC por I2C alimentado desde la celda (propuesto);</text>
<text x="1010.0" y="677.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">el panel envía la hora del navegador; el equipo la acepta solo si su hora no es válida</text>
<text x="750" y="750" font-size="19" text-anchor="middle" fill="#222" font-weight="bold">Buses internos del equipo (sección 6.11)</text>
<rect x="30" y="775" width="270" height="100" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
<text x="165.0" y="810.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">I2S</text>
<text x="165.0" y="831.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">micrófono ICS-43434</text>
<text x="165.0" y="852.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">3,072 MHz</text>
<rect x="322" y="775" width="270" height="100" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
<text x="457.0" y="810.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">SPI2</text>
<text x="457.0" y="831.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">pantalla TFT</text>
<text x="457.0" y="852.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">10–40 MHz</text>
<rect x="614" y="775" width="270" height="100" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
<text x="749.0" y="810.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">SDMMC 1 bit</text>
<text x="749.0" y="831.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">microSD</text>
<text x="749.0" y="852.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">20–40 MHz</text>
<rect x="906" y="775" width="270" height="100" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
<text x="1041.0" y="810.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">I2C (propuesto)</text>
<text x="1041.0" y="831.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">RTC · táctil futuro</text>
<text x="1041.0" y="852.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">400 kHz</text>
<rect x="1198" y="775" width="270" height="100" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
<text x="1333.0" y="810.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">USB nativo</text>
<text x="1333.0" y="831.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">Serial/JTAG: carga y registros</text>
<text x="1333.0" y="852.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">12 Mbit/s</text>
<text x="750" y="920" font-size="15" text-anchor="middle" fill="#555" font-weight="normal" font-style="italic">El recuadro verde es código propio sobre esp_http_server; los ocres son componentes de ESP-IDF fijados al núcleo 0.</text>
</svg>