<text x="960" y="168" font-size="14" text-anchor="middle" fill="#1b5e20" font-weight="normal">esp_http_server · núcleo 0 · prio 5 · pila 6 kB</text>
<rect x="785" y="182" width="350" height="46" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.3"/>
<text x="960" y="201" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">GET /, /app.js …</text>
<text x="960" y="221" font-size="14.5" text-anchor="middle" fill="#333" font-weight="normal">panel comprimido, en la imagen</text>
<rect x="785" y="234" width="350" height="46" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.3"/>
<text x="960" y="253" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">/ws (WebSocket)</text>
<text x="960" y="273" font-size="14.5" text-anchor="middle" fill="#333" font-weight="normal">v = 1 · seq · hola · inst · evento · cmd/ack</text>
<rect x="785" y="286" width="350" height="46" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.3"/>
<text x="960" y="305" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">/api/v1/sesiones, /csv, /informe</text>
<text x="960" y="325" font-size="14.5" text-anchor="middle" fill="#333" font-weight="normal">se delega a T_XFER (asíncrono)</text>
<rect x="785" y="338" width="350" height="46" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.3"/>
<text x="960" y="357" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">/api/v1/login, /config, /diag</text>
<text x="960" y="377" font-size="14.5" text-anchor="middle" fill="#333" font-weight="normal">token de técnico (PIN por desafío)</text>
<rect x="785" y="390" width="350" height="46" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.3"/>
<text x="960" y="409" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">/api/v1/ota</text>
<text x="960" y="429" font-size="14.5" text-anchor="middle" fill="#333" font-weight="normal">se delega a T_XFER (asíncrono)</text>
