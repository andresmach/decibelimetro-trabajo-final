<text x="1345.0" y="149.5" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">T_APP (prio 10)</text>
<text x="1345.0" y="170.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">FSM, sesión, NVS</text>
<text x="1345.0" y="191.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">pide la publicación</text>
<text x="1345.0" y="212.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">con httpd_queue_work</text>
<rect x="1240" y="255" width="210" height="95" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1345.0" y="277.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">T_STOR (prio 6)</text>
<text x="1345.0" y="298.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">dueña de la microSD</text>
<text x="1345.0" y="319.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">responde en bloques</text>
<text x="1345.0" y="340.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">a T_XFER</text>
<rect x="1240" y="365" width="210" height="90" rx="8" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="1345.0" y="395.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">T_XFER (prio 4)</text>
<text x="1345.0" y="416.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">descargas y OTA</text>
<text x="1345.0" y="437.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">una a la vez · 8 kB</text>
