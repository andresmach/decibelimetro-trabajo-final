<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Arial, Helvetica, sans-serif">
<rect width="1400" height="820" fill="#fff"/>
<text x="700" y="36" font-size="23" text-anchor="middle" fill="#222" font-weight="bold">Diagrama de hardware por bloques: buses, tensiones y conectores</text>
<rect x="520" y="250" width="360" height="250" rx="8" fill="#dceaf7" stroke="#1e5e9f" stroke-width="3"/>
<text x="700.0" y="339.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">ESP32-S3-WROOM-1 N16R8</text>
<text x="700.0" y="360.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">240 MHz · 2 núcleos · Wi-Fi</text>
<text x="700.0" y="381.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">16 MB flash · 8 MB PSRAM</text>
<text x="700.0" y="402.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">USB-Serial/JTAG nativo</text>
<text x="700.0" y="423.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">antena en el borde de la placa</text>
<rect x="60" y="90" width="300" height="110" rx="8" fill="#dceaf7" stroke="#1e5e9f" stroke-width="2"/>
<text x="210.0" y="130.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Placa satélite (J2)</text>
<text x="210.0" y="151.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">ICS-43434 · 3V3_MIC</text>
<text x="210.0" y="172.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">pull-down 100 kΩ en SD; filtros RF</text>
<polyline points="360,140 450,140 450,300 518,300" fill="none" stroke="#1e5e9f" stroke-width="2.4"/>
<polygon points="518,300 505.0,306.5 505.0,293.5" fill="#1e5e9f"/>
<text x="300" y="232" font-size="14" text-anchor="middle" fill="#1e5e9f" font-weight="bold">I2S: BCLK, WS, SD (33 Ω serie)</text>
<text x="300" y="252" font-size="13" text-anchor="middle" fill="#1e5e9f" font-weight="normal">cable apantallado 5 cond. + malla, ≈ 15 cm</text>
<rect x="1040" y="90" width="300" height="90" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
<text x="1190.0" y="130.5" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Pantalla TFT de 2,8 in</text>
<text x="1190.0" y="151.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">controlador ILI9341 (o similar)</text>
<polyline points="880,300 950,300 950,135 1038,135" fill="none" stroke="#555" stroke-width="2.4"/>
<polygon points="1038,135 1025.0,141.5 1025.0,128.5" fill="#555"/>
