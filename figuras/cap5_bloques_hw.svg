<rect x="1040" y="470" width="300" height="90" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
<text x="1190.0" y="510.5" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Pulsadores (3) · LED bicolor</text>
<text x="1190.0" y="531.5" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">TVS en las entradas</text>
<polyline points="880,460 960,460 960,515 1038,515" fill="none" stroke="#555" stroke-width="2.4"/>
<polygon points="1038,515 1025.0,521.5 1025.0,508.5" fill="#555"/>
<text x="990" y="450" font-size="14" text-anchor="middle" fill="#555" font-weight="bold">GPIO</text>
<rect x="60" y="350" width="300" height="120" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
<text x="210.0" y="395.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">USB-C (J1)</text>
<text x="210.0" y="416.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">D+/D− → USB nativo</text>
<text x="210.0" y="437.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">VBUS, CC → cargador y comparador</text>
<polyline points="360,400 518,400" fill="none" stroke="#555" stroke-width="2.4"/>
<polygon points="518,400 505.0,406.5 505.0,393.5" fill="#555"/>
<text x="440" y="390" font-size="14" text-anchor="middle" fill="#555" font-weight="bold">USB 2.0 FS (D+/D−)</text>
<rect x="60" y="560" width="300" height="130" rx="8" fill="#f3e8f7" stroke="#6a1b9a" stroke-width="2"/>
<text x="210.0" y="610.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Alimentación (Fig. 5.2)</text>
<text x="210.0" y="631.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">BQ24074 · 18650 · conmutador</text>
<text x="210.0" y="652.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">LDO 3,3 V · LP5907 3,3 V</text>
<polyline points="360,600 700,600 700,502" fill="none" stroke="#6a1b9a" stroke-width="2.4"/>
<polygon points="700,502 706.5,515.0 693.5,515.0" fill="#6a1b9a"/>
<text x="560" y="590" font-size="14" text-anchor="middle" fill="#6a1b9a" font-weight="bold">3V3_D</text>
<polyline points="60,625 35,625 35,145 58,145" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<polygon points="58,145 45.0,151.5 45.0,138.5" fill="#2e7d32"/>
<text x="80" y="530" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="bold">3V3_MIC</text>
<polyline points="360,650 780,650 780,502" fill="none" stroke="#555" stroke-width="2.4" stroke-dasharray="7,5"/>
<polygon points="780,502 786.5,515.0 773.5,515.0" fill="#555"/>
<text x="560" y="640" font-size="14" text-anchor="middle" fill="#555" font-weight="bold">VBAT, /CHG, /PGOOD, fuente ≥ 1,5 A, POWER_HOLD</text>
<rect x="1040" y="610" width="300" height="90" rx="8" fill="#fff" stroke="#888" stroke-width="2"/>
<text x="1190.0" y="650.5" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Puntos de prueba</text>
<text x="1190.0" y="671.5" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">VSYS, 3V3_D, 3V3_MIC, I2S, UART0</text>
<text x="700" y="780" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">Conectores: J1 USB-C · J2 vástago del micrófono (6 contactos) · J3 portapila. Pines en la Tabla 5.7.</text>
</svg>