<text x="40" y="900" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Colas FreeRTOS: mensajes por valor, sin punteros compartidos. mbx = buzón de longitud 1 (xQueueOverwrite) con la última instantánea; T_UI y T_NET reciben una notificación de tarea.</text>
<text x="40" y="925" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Ningún recurso tiene dos dueños: la microSD es solo de T_STOR, el estado solo de T_APP y las muestras solo de T_DSP; por eso no se necesitan mutex en el camino de tiempo real.</text>
