<polygon points="1078.0,88.0 1066.5,101.1 1060.5,88.5" fill="#333"/>
<polygon points="1010.0,120.0 1021.5,106.9 1027.5,119.5" fill="#333"/>
<polygon points="1078.0,213.0 1067.3,226.8 1060.6,214.5" fill="#333"/>
<polygon points="1078.0,345.0 1065.4,357.1 1060.6,344.0" fill="#333"/>
<polygon points="1010.0,370.0 1022.6,357.9 1027.4,371.0" fill="#333"/>
<polygon points="780.0,443.0 787.0,459.0 773.0,459.0" fill="#6a1b9a"/>
</svg>
