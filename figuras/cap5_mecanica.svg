<text x="1000" y="300" font-size="15" text-anchor="start" fill="#333" font-weight="normal">• Micrófono alejado del cuerpo: reduce reflexiones y</text>
<text x="1000" y="330" font-size="15" text-anchor="start" fill="#333" font-weight="normal">  difracción del gabinete en las bandas altas.</text>
<text x="1000" y="360" font-size="15" text-anchor="start" fill="#333" font-weight="normal">• Antena en el extremo opuesto al micrófono:</text>
